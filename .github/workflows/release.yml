name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ciyuan-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate tag, merged source and six version fields
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          git checkout --detach "$SHA"
          node scripts/check-release-version.mjs source "$RELEASE_TAG" .
          test -s "docs/releases/$RELEASE_TAG.md"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundles: nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            bundles: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            bundles: app,dmg
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: npm ci
      - name: Vendor macOS update helper
        if: runner.os == 'macOS'
        run: bash scripts/vendor-binary-delta.sh
      - name: Build installer and signed updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_SIGNING_PROVIDER: ""
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect canonical release artifacts
        run: node scripts/ciyuan-release.mjs collect ${{ matrix.platform }} release-assets
      - name: Windows x64 installed lifecycle verification
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-assets/*-setup.exe | Select-Object -First 1
          & ./scripts/windows-packaged-smoke.ps1 -Installer $installer.FullName -AuthenticodeMode optional
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Produce manifest, verify signatures and compute checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          node scripts/ciyuan-release.mjs manifest "$RELEASE_TAG" release-assets
          node scripts/verify-release-artifacts.mjs release-assets/latest.json release-assets src-tauri/tauri.conf.json
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Ciyuan Codex $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --generate-notes
